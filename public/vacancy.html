<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacancy Creation and Weight Configuration</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<script>nav()</script><main><div class="card"><h1>Create Vacancy and Configure Weights</h1>
<label>Job title</label><input id="t">
<label>Required skills, one per line as <code>skill, tier</code> (3 essential, 2 preferred, 1 desirable)</label><textarea id="sk" rows="6"></textarea>
<div class="grid"><div><label>Minimum years</label><input id="exp" type="number" min="0" step="0.5"></div>
<div><label>Minimum qualification</label><select id="lv"></select></div>
<div><label>Certifications required</label><input id="ct" type="number" min="0"></div></div>
<h2 style="margin-top:18px">Criteria weights (must sum to 1)</h2>
<div class="grid"><div><label>Skills</label><input id="w1" type="number" step="0.05" min="0" max="1"></div>
<div><label>Experience</label><input id="w2" type="number" step="0.05" min="0" max="1"></div>
<div><label>Qualification</label><input id="w3" type="number" step="0.05" min="0" max="1"></div>
<div><label>Certification</label><input id="w4" type="number" step="0.05" min="0" max="1"></div></div>
<button id="save">Save vacancy</button><button class="alt" id="pre">Skills-emphasised weights</button>
<button class="alt" id="def">Default weights</button><div id="m" class="msg"></div></div></main>
<script>
const $=i=>document.getElementById(i);const say=(t,c)=>{$('m').className='msg '+c;$('m').textContent=t};
$('lv').innerHTML=Object.keys(LEVELS).map(k=>`<option value="${LEVELS[k]}">${k}</option>`).join('');
const setW=w=>{$('w1').value=w.skill;$('w2').value=w.exp;$('w3').value=w.qual;$('w4').value=w.cert};
const v=DB.get('vacancy',DEF_VAC);$('t').value=v.title;$('sk').value=v.skills.map(s=>s.n+', '+s.t).join('\n');
$('exp').value=v.minExp;$('lv').value=v.minLevel;$('ct').value=v.certs;setW(v.w);
$('pre').onclick=()=>setW({skill:.6,exp:.25,qual:.1,cert:.05});$('def').onclick=()=>setW(DEF_VAC.w);
$('save').onclick=()=>{const w={skill:+$('w1').value,exp:+$('w2').value,qual:+$('w3').value,cert:+$('w4').value};
 if(Math.abs(w.skill+w.exp+w.qual+w.cert-1)>0.001)return say('Weights must add up to 1.','e');
 const skills=$('sk').value.split('\n').map(l=>l.split(',')).filter(p=>p[0].trim()).map(p=>({n:p[0].trim().toLowerCase(),t:[1,2,3].includes(+p[1])?+p[1]:3}));
 if(!$('t').value.trim()||!skills.length)return say('Enter a title and at least one skill.','e');
 DB.set('vacancy',{title:$('t').value.trim(),skills,minExp:+$('exp').value,minLevel:+$('lv').value,certs:+$('ct').value,w,mix:.5,thr:.6});
 log('Vacancy saved: '+$('t').value.trim());say('Vacancy saved. Open the Ranking page to see the result.','s')};
</script></body></html>
